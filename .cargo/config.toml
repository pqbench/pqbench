# Build the bundled C codecs with the flags lzbench uses (the e2e reference).
# snappy_src compiles snappy.cc via the `cc` crate, which injects `-fPIC` in its
# own defaults BEFORE these flags and `-fPIC` measurably slows snappy's tight
# decompress loop (~14%): `-fPIE` must come after it (last-one-wins in gcc) —
# matching lzbench's `-fPIE`.
#
# This is a *portable* baseline, deliberately without `-march=native`: a binary
# (or a cached codec object) tuned to one machine SIGILLs on another, so CI and
# the release must not use native codegen. To reproduce lzbench's native numbers
# locally, opt in for one build (an exported CXXFLAGS wins over [env] below):
#
#   CXXFLAGS="-O3 -DNDEBUG -fPIE -march=native -fomit-frame-pointer \
#     -fstrict-aliasing -ffast-math -DHAVE_BUILTIN_CTZ=1" make ...
#
# `-march=native` also makes snappy auto-derive `SNAPPY_HAVE_SSSE3`/`_X86_CRC32`/
# `_BMI2` from `__SSSE3__`/`__SSE4_2__`/`__BMI2__` (snappy.cc:32-53); we do not
# define them explicitly because doing so measurably changed snappy's decompress
# codegen vs lzbench (which defines none). `-DHAVE_BUILTIN_CTZ` is the one
# intrinsic snappy does not auto-detect, which lzbench passes via its own probe.
#
# The C codecs need the same flags via CFLAGS: the `cc` crate otherwise compiles
# C at the cargo profile's opt level. zstd was hit hardest — the dev/test profile
# (opt-level 0) built libzstd unoptimized, so the `make test` transcripts (and so
# the README's speed tables) ran zstd ~7x slow, while lz4 (which pins its own
# `-O3`), snappy (CXXFLAGS) and zlib (the system library) did not.
#
# CFLAGS stays narrow on purpose: unlike CXXFLAGS it reaches *every* C crate, not
# just snappy. `-fPIE` in particular breaks a cdylib link — aws-lc-sys is linked
# into the Python wheel, which needs `-fPIC` ("relocation R_X86_64_PC32 cannot be
# used against symbol 'stderr'") — and `-ffast-math`/`-fstrict-aliasing` are a
# gamble on dependencies the project does not own. `-O3 -DNDEBUG` is all zstd
# needs.
[build]
# Use sccache when installed and invoke rustc directly otherwise. This keeps
# fresh clones and CI working without mandatory machine-level configuration.
# The shim is POSIX, so a Windows build must unset it — cargo cannot execute the
# script there ("os error 193"): `RUSTC_WRAPPER= cargo build`.
rustc-wrapper = ".cargo/scripts/rustc-wrapper.sh"

[env]
CFLAGS = "-O3 -DNDEBUG"
CXXFLAGS = "-O3 -DNDEBUG -fPIE -fomit-frame-pointer -fstrict-aliasing -ffast-math -DHAVE_BUILTIN_CTZ=1"
