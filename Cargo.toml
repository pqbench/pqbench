[workspace]
resolver = "2"
members = [
    "crates/aipnaming",
    "crates/aipnaming-cli",
    "crates/pqbench",
    "crates/pqbench-cli",
]
exclude = ["python"]
default-members = [
    "crates/aipnaming",
    "crates/aipnaming-cli",
    "crates/pqbench",
    "crates/pqbench-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.91.1"
license = "MIT OR Apache-2.0"
authors = ["pqbench contributors"]
repository = "https://github.com/pqbench/pqbench"

[workspace.dependencies]
aipnaming = { version = "0.0.1", path = "crates/aipnaming" }
pqbench = { version = "0.0.1", path = "crates/pqbench" }

[profile.dev]
opt-level = 0
debug = 1
incremental = true
