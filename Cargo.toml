[workspace]
resolver = "2"
members = [
    "crates/aipnaming",
    "crates/aipnaming-cli",
    "crates/docscheck",
    "crates/docscheck-cli",
    "crates/pyicheck",
    "crates/pyicheck-cli",
    "crates/pqbench",
    "crates/pqbench-derive",
    "crates/pqbench-resource",
    "crates/pqbench-cli",
]
exclude = ["python"]
default-members = [
    "crates/aipnaming",
    "crates/aipnaming-cli",
    "crates/docscheck",
    "crates/docscheck-cli",
    "crates/pyicheck",
    "crates/pyicheck-cli",
    "crates/pqbench",
    "crates/pqbench-derive",
    "crates/pqbench-resource",
    "crates/pqbench-cli",
]

[workspace.package]
version = "0.0.6"
edition = "2021"
rust-version = "1.91.1"
license = "MIT OR Apache-2.0"
authors = ["pqbench contributors"]
repository = "https://github.com/pqbench/pqbench"

[workspace.dependencies]
aipnaming = { version = "0.0.6", path = "crates/aipnaming" }
docscheck = { version = "0.0.6", path = "crates/docscheck" }
pqbench = { version = "0.0.6", path = "crates/pqbench" }
pyicheck = { version = "0.0.6", path = "crates/pyicheck" }

[profile.dev]
opt-level = 0
debug = 1
incremental = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
