[workspace]
resolver = "2"
members = [
    "crates/aipnaming",
    "crates/aipnaming-cli",
    "crates/docscheck",
    "crates/docscheck-cli",
    "crates/docsgen",
    "crates/pqbench",
    "crates/pqbench-derive",
    "crates/pqbench-model-v1",
    "crates/pqbench-parquet",
    "crates/pqbench-resource",
    "crates/pqbench-cli",
    "crates/pqbench-driver",
]
default-members = [
    "crates/aipnaming",
    "crates/aipnaming-cli",
    "crates/docscheck",
    "crates/docscheck-cli",
    "crates/docsgen",
    "crates/pqbench",
    "crates/pqbench-derive",
    "crates/pqbench-model-v1",
    "crates/pqbench-parquet",
    "crates/pqbench-resource",
    "crates/pqbench-cli",
    "crates/pqbench-driver",
]

[workspace.package]
version = "0.0.12"
edition = "2021"
rust-version = "1.91.1"
license = "MIT OR Apache-2.0"
authors = ["pqbench contributors"]
repository = "https://github.com/pqbench/pqbench"

[workspace.dependencies]
aipnaming = { version = "0.0.12", path = "crates/aipnaming" }
# Already in the graph through `parquet` 59: the RFC 4648 codec and the civil
# calendar, reused instead of a second parser. `default-features = false` keeps
# chrono to the date and time values the rules read, with no clock or time zone
# database.
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std"] }
docscheck = { version = "0.0.12", path = "crates/docscheck" }
pqbench = { version = "0.0.12", path = "crates/pqbench" }
pqbench-model-v1 = { version = "0.0.12", path = "crates/pqbench-model-v1" }
pqbench-parquet = { version = "0.0.12", path = "crates/pqbench-parquet" }
pqbench-driver = { version = "0.0.12", path = "crates/pqbench-driver" }

[profile.dev]
opt-level = 0
debug = 1
incremental = true
# Leave DWARF in `.dwo` files next to the object, not inside the binary: a test
# binary that links the whole graph is hundreds of megabytes of debug info, and
# every link of it is a multi-gigabyte operation. Backtraces and `gdb` still
# find the line tables; the executable does not carry them.
split-debuginfo = "unpacked"

# No debug info for dependencies: the AWS SDK, arrow and deltalake are most of
# every test binary and of its link, and their line tables are rarely read. Backtraces still resolve the workspace's own frames.
[profile.dev.package."*"]
debug = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
