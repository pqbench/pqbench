name: CI heavy

on:
  pull_request:
    # Marking a draft ready starts the heavy cycle; drafts skip every job here.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a new push cancels the superseded run. Keyed on the branch
# (head_ref for PRs, commit for pushes) and the workflow so concurrent
# workflows for the same commit don't cancel each other.
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.94.1"

# rust-cache policy: only the default branch saves (the `save-if` on each cache
# step). A PR restores main's cache — GitHub serves the default branch's caches
# to every branch — but if it also saved, its copy would live under
# refs/pull/N/merge, readable by no other branch, and the duplicates push the
# repo past its 10 GB cache limit, evicting the entries PRs restore. So PRs
# read and never write; only main's set is kept, and it stays under the limit.
jobs:
  # Clippy once over the union of features. Isolated feature sets don't need
  # their own lint pass: `--all-features` sees every gated `cfg(feature = ...)`
  # rename (or, for a deliberate exception, add `// aipnaming: allow(...)`).
  clippy:
    name: Clippy
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: make lint CARGO_FEATURES=--all-features

  # Drafts run only the lightweight workflow; this one runs on non-draft PRs.
  # `cargo test` builds as it goes, so there is no separate build step. A leg
  # per feature set catches feature-gating bugs, and `--include-ignored` turns
  # on the network e2e (redset, gated on `aws`) on the aws/all-features legs.
  # default and all-features also run on arm64; fmt/clippy are arch-independent.
  test:
    name: Test (${{ matrix.features || 'default' }}, ${{ matrix.arch }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            features: ""
            cargo_flags: ""
            test_flags: ""
          - os: ubuntu-24.04
            arch: amd64
            features: aws
            cargo_flags: --features aws
            test_flags: --include-ignored
          - os: ubuntu-24.04
            arch: amd64
            features: delta
            cargo_flags: --features delta
            test_flags: ""
          - os: ubuntu-24.04
            arch: amd64
            features: iceberg
            cargo_flags: --features iceberg
            test_flags: ""
          - os: ubuntu-24.04
            arch: amd64
            features: all-features
            cargo_flags: --all-features
            test_flags: --include-ignored
          # arm64: default catches arch/codec issues, all-features covers the
          # delta/aws build. aws/delta alone stay amd64 to bound the job count.
          - os: ubuntu-24.04-arm
            arch: arm64
            features: ""
            cargo_flags: ""
            test_flags: ""
          - os: ubuntu-24.04-arm
            arch: arm64
            features: all-features
            cargo_flags: --all-features
            test_flags: --include-ignored
    steps:
      - uses: actions/checkout@v6
        with:
          # Test fixtures are LFS-typed (see .gitattributes).
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache per (arch, feature set): a single target dir only holds one
          # feature configuration, so sharing across feature sets makes cargo
          # rebuild every crate whose features differ. Key on both so each leg
          # reuses its own artifacts.
          key: ${{ matrix.arch }}-${{ matrix.features || 'default' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: make test CARGO_FEATURES="${{ matrix.cargo_flags }}" TEST_FLAGS="${{ matrix.test_flags }}"

  python:
    name: Python
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: python
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: make check-python

  # The lakehouse stand: compose up the object store and catalogs, seed the
  # Delta and Iceberg tables, then walk them. Not run on fork PRs.
  lakehouse-stand:
    name: Lakehouse stand (arm64)
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && (!github.event.pull_request.draft))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          # The stand's Delta and Iceberg tables are LFS-typed (see .gitattributes).
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: arm64-delta-s3-unity-iceberg-stand
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Bring the lakehouse stand up and check it
        run: make lakehouse

  # The live Databricks metastore e2e: mints the service principal's OAuth
  # bearer in-test and reads the live metastore record. Runs after `ci` (the
  # required gate) and is deliberately not required, so a flaky endpoint never
  # blocks a merge. Skipped on fork PRs, whose secrets are not ours to rely on.
  dbx-metastore-e2e:
    name: Databricks metastore e2e
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && (!github.event.pull_request.draft))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: amd64-metastore
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Secrets are scoped to this step, so the third-party actions above never
      # receive them in their environment.
      - name: Run the live Databricks metastore e2e
        env:
          DBX_HOST: ${{ secrets.DBX_HOST }}
          DBX_SAMPLES_SP_CLIENT_ID: ${{ secrets.DBX_SAMPLES_SP_CLIENT_ID }}
          DBX_SAMPLES_SP_CLIENT_SECRET: ${{ secrets.DBX_SAMPLES_SP_CLIENT_SECRET }}
        run: make dbx-e2e

  # The live walk (scripts/dbx-walk.sh, `make dbx-walk`): one pass over the
  # whole-Unity-Catalog metadata walk, through `bytemass`. It authenticates with
  # the GitHub Actions OIDC token (workload identity federation) — no stored
  # secret — and falls back to the service principal's client secret. It
  # profiles nothing: a hosted runner has no PMU, so `perf stat` would report
  # only wall clock. Required: the S3 adapter reclassifies a dropped pooled
  # connection as retryable, so the walk is stable on the shared, rate-limited
  # live endpoint. Skipped on fork PRs.
  dbx-walk:
    name: Databricks walk
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && (!github.event.pull_request.draft))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: amd64-walk
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Secrets are scoped to this step, so the third-party actions above never
      # receive them in their environment.
      - name: Run the walk
        env:
          DBX_HOST: ${{ secrets.DBX_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DBX_SAMPLES_SP_CLIENT_ID }}
          DATABRICKS_ACCOUNT_ID: ${{ secrets.DBX_ACCOUNT_ID }}
          DBX_SAMPLES_SP_CLIENT_ID: ${{ secrets.DBX_SAMPLES_SP_CLIENT_ID }}
          DBX_SAMPLES_SP_CLIENT_SECRET: ${{ secrets.DBX_SAMPLES_SP_CLIENT_SECRET }}
        run: make dbx-walk

  # Single status for the heavy cycle; skipped jobs are expected on drafts.
  ci-heavy:
    name: Heavy gate
    if: always()
    needs: [clippy, test, python, lakehouse-stand, dbx-metastore-e2e, dbx-walk]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if a heavy job did not succeed
        run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
