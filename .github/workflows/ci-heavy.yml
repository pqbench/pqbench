name: CI heavy

on:
  pull_request:
    # Marking a draft ready starts the heavy cycle; drafts skip every job here.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a new push cancels the superseded run. Keyed on the branch
# (head_ref for PRs, commit for pushes) and the workflow so concurrent
# workflows for the same commit don't cancel each other.
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.94.1"
  # Override .cargo/config.toml's `-march=native` (Cargo [env] does not override
  # an existing variable). Native-tuned codec objects restored from a cache built
  # on a differently-featured runner caused SIGILL; a portable baseline is safe
  # to cache and to share across runners. Same idea as scripts/docker_build.sh.
  CXXFLAGS: "-O3 -DNDEBUG -fPIE -fomit-frame-pointer -fstrict-aliasing -ffast-math -DHAVE_BUILTIN_CTZ=1"

jobs:
  clippy:
    name: Clippy
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      - run: make lint CARGO_FEATURES=--all-features

  # Drafts run only the lightweight workflow; this one runs on non-draft PRs.
  # `cargo test` builds as it goes, so there is no separate build step. A leg
  # per feature set catches feature-gating bugs, and `--include-ignored` turns
  # on the network e2e (redset, gated on `aws`) on the aws/all-features legs.
  # default and all-features also run on arm64; fmt/clippy are arch-independent.
  test:
    name: Test (${{ matrix.features || 'default' }}, ${{ matrix.arch }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            features: ""
            cargo_flags: ""
            test_flags: ""
          - os: ubuntu-24.04
            arch: amd64
            features: aws
            cargo_flags: --features aws
            test_flags: --include-ignored
          - os: ubuntu-24.04
            arch: amd64
            features: delta
            cargo_flags: --features delta
            test_flags: ""
          - os: ubuntu-24.04
            arch: amd64
            features: iceberg
            cargo_flags: --features iceberg
            test_flags: ""
          - os: ubuntu-24.04
            arch: amd64
            features: all-features
            cargo_flags: --all-features
            test_flags: --include-ignored
          # arm64: default catches arch/codec issues, all-features covers the
          # delta/aws build. aws/delta alone stay amd64 to bound the job count.
          - os: ubuntu-24.04-arm
            arch: arm64
            features: ""
            cargo_flags: ""
            test_flags: ""
          - os: ubuntu-24.04-arm
            arch: arm64
            features: all-features
            cargo_flags: --all-features
            test_flags: --include-ignored
    steps:
      - uses: actions/checkout@v6
        with:
          # Test fixtures are LFS-typed (see .gitattributes).
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache per (arch, feature set): a single target dir only holds one
          # feature configuration, so sharing across feature sets makes cargo
          # rebuild every crate whose features differ. Key on both so each leg
          # reuses its own artifacts.
          key: ${{ matrix.arch }}-${{ matrix.features || 'default' }}
      - run: make test CARGO_FEATURES="${{ matrix.cargo_flags }}" TEST_FLAGS="${{ matrix.test_flags }}"

  # Build the naming linter and run it over the workspace. Findings render as
  # inline annotations on the PR diff (the `github` output format) and a
  # per-rule breakdown lands in the job summary; any finding fails the job, so
  # the check is a real gate. Like `clippy`, the fix for the author is to

  python:
    name: Python
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: python
      - run: make check-python

  # Single required status: fails if any upstream job failed, was cancelled or
  # fork PRs, whose secrets and Docker Hub access are not ours to rely on.
  lakehouse-stand:
    name: Lakehouse stand (arm64)
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && (!github.event.pull_request.draft))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          # The stand's Delta and Iceberg tables are LFS-typed (see .gitattributes).
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: arm64-delta-s3-unity-iceberg-stand
      - name: Bring the lakehouse stand up and check it
        run: make lakehouse

  # The live Databricks metastore e2e: mints the service principal's OAuth
  # bearer in-test and reads the live metastore record. Runs after `ci` (the
  # required gate) and is deliberately not required, so a flaky endpoint never
  # blocks a merge. Skipped on fork PRs, whose secrets are not ours to rely on.
  dbx-metastore-e2e:
    name: Databricks metastore e2e
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && (!github.event.pull_request.draft))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: amd64-metastore
      # Secrets are scoped to this step, so the third-party actions above never
      # receive them in their environment.
      - name: Run the live Databricks metastore e2e
        env:
          DBX_HOST: ${{ secrets.DBX_HOST }}
          DBX_SAMPLES_SP_CLIENT_ID: ${{ secrets.DBX_SAMPLES_SP_CLIENT_ID }}
          DBX_SAMPLES_SP_CLIENT_SECRET: ${{ secrets.DBX_SAMPLES_SP_CLIENT_SECRET }}
        run: make dbx-e2e

  # Single status for the heavy cycle; skipped jobs are expected on drafts.
  ci-heavy:
    name: Heavy gate
    if: always()
    needs: [clippy, test, python, lakehouse-stand, dbx-metastore-e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if a heavy job did not succeed
        run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
