# Publish the PyO3 wheel in python/ to PyPI.
#
# Its own dispatch, deliberately. The binary release and the wheel are two
# targets with different client rules, and PyPI can only name a workflow file:
# a job defined in a workflow that another workflow *calls* presents a claim
# (`job_workflow_ref`) whose acceptance is unverified (pypi/warehouse#11096), so
# hanging the wheel off `release.yml`'s `publish-jobs` would need either that
# support or a stored token. Two dispatches, no token at all.
#
# Trusted publishing, not a long-lived secret: `permissions: id-token: write`
# plus a pending publisher for this repository (owner `pqbench`, repository
# `pqbench`, workflow `publish-pypi.yml`, environment `pypi`), which the `pypi`
# environment gates.
#
# https://docs.pypi.org/trusted-publishers/
#
# The version is the workspace's. `scripts/version.sh sync` writes
# `[workspace.package] version` from `Cargo.toml` into `python/Cargo.toml`
# before maturin reads it, so the wheel carries the version the binaries were
# released under — the same script `make check-version` runs. PyPI versions are
# immutable, hence `skip-existing`: a re-run after a partial failure uploads
# only what is missing.
#
# The wheel is built with every storage backend (`[tool.maturin] features` in
# pyproject.toml), so `pip install pqbench` reads `s3://` and Delta/Iceberg
# tables; a wheel cannot be rebuilt by its user.
#
# Linux wheels keep the portable codec baseline (no -march=native) and pin
# aarch64 to the `neoverse-n1` generation, so a wheel built on a newer CPU
# still runs on an older one.

name: Publish Python package

on:
  # A wheel on its own, once the matching tag is released:
  # `gh workflow run publish-pypi.yml`, or from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build wheel (${{ matrix.target }})
    if: github.repository == 'pqbench/pqbench'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            cxxflags: "-O3 -DNDEBUG -fPIE -fomit-frame-pointer -fstrict-aliasing -ffast-math -DHAVE_BUILTIN_CTZ=1"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            cxxflags: "-O3 -DNDEBUG -fPIE -fomit-frame-pointer -fstrict-aliasing -ffast-math -DHAVE_BUILTIN_CTZ=1 -mcpu=neoverse-n1"
            rustflags: "-C target-cpu=neoverse-n1"
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
      - name: Take the wheel version from the workspace manifest
        shell: bash
        run: sh scripts/version.sh sync
      - uses: PyO3/maturin-action@v1
        env:
          CXXFLAGS: ${{ matrix.cxxflags }}
          RUSTFLAGS: ${{ matrix.rustflags }}
        with:
          target: ${{ matrix.target }}
          working-directory: python
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: python/dist

  sdist:
    name: Build sdist
    if: github.repository == 'pqbench/pqbench'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Take the wheel version from the workspace manifest
        shell: bash
        run: sh scripts/version.sh sync
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: python
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist

  publish:
    name: Publish to PyPI
    needs: [build, sdist]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
