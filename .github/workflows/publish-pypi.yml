# Publish the PyO3 wheel in python/ to PyPI.
#
# Trusted publishing, not a long-lived token. One-time setup:
#   1. PyPI → Publishing → add a pending publisher
#      owner: pqbench, repository: pqbench,
#      workflow: publish-pypi.yml, environment: pypi
#   2. GitHub → Settings → Environments → create "pypi"
#   3. Run this workflow, or publish a GitHub Release
#
# https://docs.pypi.org/trusted-publishers/
#
# CXXFLAGS is the portable codec baseline from ci.yml (no -march=native).
# A wheel built with native flags SIGILLs on other CPUs.

name: Publish Python package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build wheel (${{ matrix.target }})
    if: github.repository == 'pqbench/pqbench'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            cxxflags: "-O3 -DNDEBUG -fPIE -fomit-frame-pointer -fstrict-aliasing -ffast-math -DHAVE_BUILTIN_CTZ=1"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            cxxflags: "-O3 -DNDEBUG -fPIE -fomit-frame-pointer -fstrict-aliasing -ffast-math -DHAVE_BUILTIN_CTZ=1"
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        env:
          CXXFLAGS: ${{ matrix.cxxflags }}
        with:
          target: ${{ matrix.target }}
          working-directory: python
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: python/dist

  sdist:
    name: Build sdist
    if: github.repository == 'pqbench/pqbench'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: python
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist

  publish:
    name: Publish to PyPI
    needs: [build, sdist]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
