name: Docker

on:
  pull_request:
  push:
    branches: ['**']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: docker/setup-buildx-action@v4
      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: pqbench:test
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
      - name: Smoke test
        run: sh scripts/test_docker.sh pqbench:test

  publish:
    name: Publish release to Docker Hub
    needs: test
    if: github.event_name == 'release' && github.repository == 'pqbench/pqbench'
    runs-on: ubuntu-24.04
    env:
      # Set this repository variable to change the destination namespace/image.
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'pqbench/pqbench' }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Check release tag and publishing credentials
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          # Placeholders: maintainers configure these in repository secrets.
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$'; then
            echo 'Release tags must use vMAJOR.MINOR.PATCH with an optional prerelease suffix.' >&2
            exit 1
          fi
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo 'Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets before publishing.' >&2
            exit 1
          fi
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest
      - name: Publish multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=docker-amd64
            type=gha,scope=docker-arm64
