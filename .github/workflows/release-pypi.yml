# Publish the data-only wheel (the `pqbench` binary) to PyPI.
#
# Its own dispatch, deliberately. The binary release and the wheel are two
# targets with different client rules, and PyPI can only name a workflow file:
# a job defined in a workflow that another workflow *calls* presents a claim
# (`job_workflow_ref`) whose acceptance is unverified (pypi/warehouse#11096), so
# hanging the wheel off `release.yml`'s `publish-jobs` would need either that
# support or a stored token. Two dispatches, no token at all.
#
# Trusted publishing, not a long-lived secret: `permissions: id-token: write`
# plus a pending publisher for this repository (owner `pqbench`, repository
# `pqbench`, workflow `release-pypi.yml`, environment `pypi`), which the `pypi`
# environment gates.
#
# https://docs.pypi.org/trusted-publishers/
#
# The version is the workspace's: the wheel is built from `crates/pqbench-cli`,
# which inherits `[workspace.package] version`, so maturin reads it directly and
# the wheel cannot ship a version the binaries did not. PyPI versions are
# immutable, hence `skip-existing`: a re-run after a partial failure uploads
# only what is missing.
#
# The wheel is built with every storage backend (`[tool.maturin] features` in
# crates/pqbench-cli/pyproject.toml), so `pip install pqbench` reads `s3://` and
# Delta/Iceberg tables; a wheel cannot be rebuilt by its user. It carries the
# binary in `.data/scripts/` (`bindings = "bin"`), not a Python extension.
#
# Linux wheels keep the portable codec baseline (no -march=native), build
# in manylinux2014 — glibc 2.17, the floor the archives use — and pin aarch64 to
# the `neoverse-n1` generation, so a wheel built on a newer CPU still runs on an
# older one. Without the manylinux container a wheel inherits the runner's glibc
# and is tagged `manylinux_2_39`, which excludes every older distribution.
#
# macOS wheels declare the floor their target starts at: 11 for arm64, 13 for
# Intel — what the retired `macos-13` runner produced, its replacement being
# `macos-15-intel`.
#
# No Windows wheel: nothing in the project builds for MSVC — no CI leg, no
# `dist` target — and the first attempt died on `.cargo/config.toml`'s
# `rustc-wrapper`, a POSIX shim Windows cannot execute (`os error 193`). A
# Windows user with a Rust toolchain can build the sdist instead.

name: Publish to PyPI

on:
  # A wheel on its own, once the matching tag is released:
  # `gh workflow run release-pypi.yml`, or from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build wheel (${{ matrix.target }})
    if: github.repository == 'pqbench/pqbench'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The four targets the binary release builds (dist-workspace.toml), so
          # an archive and a wheel always cover the same platforms.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
            cxxflags: "-O3 -DNDEBUG -fPIE -fomit-frame-pointer -fstrict-aliasing -ffast-math -DHAVE_BUILTIN_CTZ=1"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2014"
            cxxflags: "-O3 -DNDEBUG -fPIE -fomit-frame-pointer -fstrict-aliasing -ffast-math -DHAVE_BUILTIN_CTZ=1 -mcpu=neoverse-n1"
            rustflags: "-C target-cpu=neoverse-n1"
          - os: macos-15-intel
            target: x86_64-apple-darwin
            macosx_deployment_target: "13.0"
          - os: macos-14
            target: aarch64-apple-darwin
            macosx_deployment_target: "11.0"
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        env:
          CXXFLAGS: ${{ matrix.cxxflags }}
          RUSTFLAGS: ${{ matrix.rustflags }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          working-directory: crates/pqbench-cli
          args: --release --out ../../python/dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: python/dist

  sdist:
    name: Build sdist
    if: github.repository == 'pqbench/pqbench'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: crates/pqbench-cli
          args: --out ../../python/dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist

  publish:
    name: Publish to PyPI
    needs: [build, sdist]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
