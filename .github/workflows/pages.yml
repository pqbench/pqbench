# Build the pqbench documentation site and publish it to GitHub Pages.
#
# The site is the repository's own Markdown under `docs/`, rendered by MkDocs
# Material; `mkdocs build --strict` fails on a page missing from the nav or a
# broken anchor, so the build is the docs gate. Links to repository files
# outside `docs/` are ignored by `mkdocs.yml`; PR CI also builds the site.
# Sources outside `docs/` that a page includes (`python/README.md`,
# `CONTRIBUTING.md`) are watched too.
#
# One-time setup: in the repository's Settings, set Pages -> Build and
# deployment -> Source to "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "overrides/**"
      - "requirements-docs.txt"
      - "python/README.md"
      - "CONTRIBUTING.md"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight deploy finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - name: Build
        run: mkdocs build --strict
        env:
          # Suppress the theme's MkDocs 2.0 notice; it is not a build warning.
          NO_MKDOCS_2_WARNING: "true"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
