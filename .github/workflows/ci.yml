name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a new push cancels the superseded run. Keyed on the branch
# (head_ref for PRs, commit for pushes) and the workflow so concurrent
# workflows for the same commit don't cancel each other.
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.94.1"
  # Override .cargo/config.toml's `-march=native` (Cargo [env] does not override
  # an existing variable). Native-tuned codec objects restored from a cache built
  # on a differently-featured runner caused SIGILL; a portable baseline is safe
  # to cache and to share across runners. Same idea as scripts/docker_build.sh.
  CXXFLAGS: "-O3 -DNDEBUG -fPIE -fomit-frame-pointer -fstrict-aliasing -ffast-math -DHAVE_BUILTIN_CTZ=1"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: make fmt-check

  # Clippy once over the union of features. Isolated feature sets don't need
  # their own lint pass: `--all-features` sees every gated `cfg(feature = ...)`
  # rename (or, for a deliberate exception, add `// aipnaming: allow(...)`).
  aipnaming:
    name: aipnaming
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: aipnaming
      - name: Build the linter
        run: cargo build --release -p aipnaming-cli
      - name: Lint the workspace
        run: |
          # Annotations land inline on the PR diff.
          ./target/release/aipnaming --output-format github crates/
          # Full list plus a per-rule breakdown, for the log and the summary.
          ./target/release/aipnaming --statistics crates/ 2> stats.txt | tee findings.txt || true
          {
            echo '### aipnaming'
            echo
            if [ -s findings.txt ]; then
              echo '```'
              cat stats.txt
              echo '```'
            else
              echo 'No findings.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # The gate: exit non-zero if any finding remains.
          ./target/release/aipnaming crates/ > /dev/null

  # The documented `pqbench ...` commands are generated into
  # `crates/pqbench-cli/tests/gen_*.rs` and run by `make test` like any other
  # integration test. This job only checks the generated files match the
  # Markdown: edit a doc block and forget to `make sync-docs`, and it fails.
  docs:
    name: docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
      - run: make check-docs

  # The `third_party` wrappers must keep their feature flags in `impl.rs`; an
  # `api.rs` always compiles and fails at runtime without its feature. A plain
  # textual check (no build or cache needed) that renders findings as inline
  # annotations and a job summary, and fails the job on any leak.
  isolation:
    name: isolation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check third_party isolation
        run: |
          # Annotations land inline on the PR diff.
          if ./scripts/check_isolation.sh --github > annotations.txt; then
            status=ok
          else
            status=leak
          fi
          cat annotations.txt
          {
            echo '### isolation'
            echo
            if [ "$status" = leak ]; then
              echo 'Feature flags leaked into an `api.rs`.'
              echo '```'
              cat annotations.txt
              echo '```'
            else
              echo 'No findings.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # The gate: non-zero if any api.rs carries a feature flag.
          [ "$status" = ok ]

  # Software metrics of the source tree, from a pinned rust-code-analysis
  # release binary (no workspace dependency, on purpose — see AGENTS.md). On a
  # pull request it analyzes only the changed Rust files, head and base side by
  # side: per-function annotations land on the diff, a sticky comment carries
  # the base→head deltas, and the raw per-file diff goes to the log. On a push
  # it rolls the whole tree up for the job summary. Report-only: not part of
  # the required `CI` gate, and not run by `make check`.
  code-analysis:
    name: Code analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write   # the sticky delta comment
    steps:
      - uses: actions/checkout@v6
      - name: Install rust-code-analysis-cli
        run: |
          # The release archive, fetched over TLS and verified by checksum.
          curl -sSL -o rca.tar.gz \
            https://github.com/mozilla/rust-code-analysis/releases/download/v0.0.25/rust-code-analysis-linux-cli-x86_64.tar.gz
          echo "9ec2a217b8ff191e02dab5d5f2eee6158b63fd975c532b2c5d67c2e6c7249894  rca.tar.gz" | sha256sum -c -
          tar xzf rca.tar.gz
          ./rust-code-analysis-cli --version
      - name: Measure
        id: measure
        run: |
          # One JSON document per source file, in parallel (the CLI's default
          # -j is every core); `diff -r` pairs them by path, order-independent.
          rca() { "$GITHUB_WORKSPACE/rust-code-analysis-cli" --metrics "$@"; }
          head_metrics="$RUNNER_TEMP/head-metrics"
          base_metrics=""
          scope="the workspace"
          mkdir -p "$head_metrics"
          if [ "${{ github.event_name }}" != pull_request ]; then
            rca -O json --pr -o "$head_metrics" -p crates
          else
            # Only the Rust files this PR changed. The checkout is the merge
            # commit, so diffing the base tip against HEAD is the PR's change.
            base_sha="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=1 origin "$base_sha"
            mapfile -t files < <(git diff --name-only --no-renames \
              --diff-filter=ACM "$base_sha" HEAD -- '*.rs')
            scope="no Rust files changed"
            if [ ${#files[@]} -gt 0 ]; then
              args=(); for file in "${files[@]}"; do args+=(-p "$file"); done
              rca -O json --pr -o "$head_metrics" "${args[@]}"
              base_tree="$RUNNER_TEMP/base-tree"
              base_metrics="$RUNNER_TEMP/base-metrics"
              mkdir -p "$base_tree" "$base_metrics"
              # Base versions of the files that exist there; added files have none.
              base_args=()
              for file in "${files[@]}"; do
                if git cat-file -e "$base_sha:$file" 2>/dev/null; then
                  mkdir -p "$base_tree/$(dirname "$file")"
                  git show "$base_sha:$file" > "$base_tree/$file"
                  base_args+=(-p "$file")
                fi
              done
              if [ ${#base_args[@]} -gt 0 ]; then
                ( cd "$base_tree" && "$GITHUB_WORKSPACE/rust-code-analysis-cli" \
                    --metrics -O json --pr -o "$base_metrics" "${base_args[@]}" )
              fi
              scope="${#files[@]} changed Rust file(s)"
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "scope: $scope"

          # The CLI is per-file; roll the file-level metrics up for the job
          # summary (the full JSON is ~9 MB, over the 1 MiB cap). A no-op PR
          # still gets a line, so the job is never silent.
          {
            echo "### Code analysis — $scope"
            echo
            if find "$head_metrics" -name '*.json' -print -quit | grep -q .; then
              echo '```json'
              find "$head_metrics" -name '*.json' -print0 | xargs -0 jq -s '{
                files: length,
                sloc: (map(.metrics.loc.sloc) | add),
                cloc: (map(.metrics.loc.cloc) | add),
                functions: (map(.metrics.nom.functions) | add),
                cyclomatic_total: (map(.metrics.cyclomatic.sum) | add),
                cyclomatic_max: (map(.metrics.cyclomatic.max) | max),
                cognitive_total: (map(.metrics.cognitive.sum) | add),
                mi_average: ((map(.metrics.mi.mi_visual_studio) | add) / length | . * 10 | round / 10)
              }'
              echo '```'
            else
              echo "_No Rust files changed._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Every PR gets a sticky comment — the base→head deltas, or a plain
          # note when nothing Rust changed — so the job is never invisible.
          if [ "${{ github.event_name }}" = pull_request ]; then
            python3 scripts/code_analysis.py comment "$head_metrics" \
              "$base_metrics" "${{ github.base_ref }}" > "$RUNNER_TEMP/comment.md"
            if [ -n "$base_metrics" ]; then
              echo "::group::Metrics diff vs ${{ github.base_ref }}"
              diff -ru "$base_metrics" "$head_metrics" || true
              echo "::endgroup::"
            fi
          fi
      - name: Annotate the changed files
        if: steps.measure.outputs.changed == 'true'
        run: python3 scripts/code_analysis.py annotate "$RUNNER_TEMP/head-metrics"
      - name: Comment on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: code-analysis
          path: ${{ runner.temp }}/comment.md

  # Every LFS-typed file must be committed as a pointer. A raw git blob checks
  # out (the smudge filter warns but does not fail) yet is never uploaded to the
  # LFS server, so it goes unnoticed until someone clones fresh.
  lfs:
    name: LFS pointers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          # fsck checks the pointer's object too, so the objects must be local.
          lfs: true
      - run: make lfs-check
  # was skipped, so branch protection only has to require `CI`.
  ci:
    name: CI
    if: always()
    needs: [fmt, aipnaming, docs, isolation, lfs]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if a required job did not succeed
        run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')

  # The lakehouse stand end to end: rustfs, Unity Catalog, Iceberg REST, and the
  # table pipes this stack adds. Runs after `ci` (the required gate), on arm64
  # (the images are multi-arch), and is deliberately not required so a flaky
  # catalog never blocks a merge; it fails loudly when it does run. Skipped on
