[package]
name = "pqbench-py"
# Written from the workspace version by `make sync-version`: python/ is its own
# crate, so it cannot inherit [workspace.package]. `make check-version` fails
# when this is stale. The wheel version comes from here.
version = "0.0.7"
edition = "2021"
rust-version = "1.91.1"
license = "MIT OR Apache-2.0"
authors = ["pqbench contributors"]
repository = "https://github.com/pqbench/pqbench"
description = "PyO3 bindings for the pqbench command line."
publish = false

[workspace]

# `maturin develop` reinstalls the debug cdylib on every run, so its size is a
# per-run cost: at the default `debug = 2` it was 722 MiB — 555 MiB of it DWARF
# and 75 MiB symbol tables — and maturin's install copy alone took ~15 s. This
# crate is its own workspace root, so it does not inherit the root workspace's
# `debug = 1`; the extension is not debugged, so it asks for no debug info. The
# wheel is built in the release profile and is unaffected.
[profile.dev]
debug = 0

[lib]
name = "native"
crate-type = ["cdylib"]

[features]
default = ["delta"]
delta = ["pqbench/delta"]
aws = ["pqbench/aws"]
delta-s3 = ["delta", "aws", "pqbench/delta-s3"]
iceberg = ["pqbench/iceberg"]
iceberg-s3 = ["iceberg", "aws", "pqbench/iceberg-s3"]

[dependencies]
futures = "0.3"
pqbench = { path = "../crates/pqbench" }
pyo3 = { version = "0.29.2", features = ["abi3-py39"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
serde = { version = "1", default-features = false }
serde_json = "1"
# `sync` and `rt-multi-thread` back the bridge: the shared runtime plus the
# channel that streams a partition/file iterator to Python.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync"] }
