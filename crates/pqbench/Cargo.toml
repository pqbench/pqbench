[package]
name = "pqbench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "A benchmarking library for Parquet files (in-memory read/write throughput, compression ratio)."

[features]
default = []
# S3 object reads. Without it, `s3://` fails at runtime, not at compile time.
aws = ["dep:object_store", "object_store/aws"]
# Delta snapshot resolution requires Rust 1.91.1 or newer.
delta = ["dep:deltalake", "dep:buoyant_kernel_derive", "dep:futures"]
delta-s3 = ["delta", "deltalake/s3", "aws"]
# Listing a Unity Catalog / Databricks lake over HTTP. Without it the client
# still compiles but `unity::list_tables` fails at runtime.
unity = ["dep:reqwest"]

[dependencies]
snappy_src = "0.2.5"
zstd = "0.13"
lz4 = "1"
flate2 = { version = "1", default-features = false, features = ["zlib"] }
glob = "0.3"
parquet = { version = "59", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
bytes = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
deltalake = { version = "=0.32.4", default-features = false, features = ["rustls"], optional = true }
# delta-rs 0.32.4 was released against the 1.0 proc macros. Its transitive
# semver range also accepts 1.2, whose renamed macros do not compile with
# buoyant_kernel 0.22.2. Keep this direct pin until delta-rs updates the range.
buoyant_kernel_derive = { version = "=1.0.0", optional = true }
futures = { version = "0.3", optional = true }
tokio = { version = "1", features = ["fs", "rt", "io-util"] }
url = "2"
# Must match delta-rs 0.32.4's ObjectStore trait version: stores cross that
# internal boundary. Keep the pin until delta-rs upgrades its dependency.
object_store = { version = "=0.13.2", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
