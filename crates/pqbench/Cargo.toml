[package]
name = "pqbench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "A benchmarking library for Parquet files (in-memory read/write throughput, compression ratio)."
# One integration-test target (`tests/it.rs`) instead of one per file: each
# file as its own target links the whole dependency graph again.
autotests = false

[[test]]
name = "it"
path = "tests/it.rs"

[features]
default = []
# S3 object reads. Without it, `s3://` fails at runtime, not at compile time.
# reqwest signs a HEAD to read `x-amz-storage-class`, which object_store drops.
aws = ["dep:object_store", "object_store/aws", "dep:async-trait"]
# Delta snapshot resolution requires Rust 1.94.1 or newer.
delta = ["dep:deltalake", "dep:delta_kernel", "dep:percent-encoding", "dep:futures", "dep:tokio"]
delta-s3 = ["delta", "deltalake/s3", "aws"]
# Iceberg snapshot planning reads metadata JSON and Avro manifests.
iceberg = ["dep:apache-avro"]
iceberg-s3 = ["iceberg", "aws"]

[dependencies]
snappy_src = "0.2.5"
zstd = "0.13"
lz4 = "1"
flate2 = { version = "1", default-features = false, features = ["zlib"] }
glob = "0.3"
# Codecs are enabled so `profile_file` can decode compressed pages; without
# them parquet-rs fails at runtime (`Disabled feature at compile time`).
parquet = { version = "59", default-features = false, features = ["snap", "brotli", "lz4", "zstd", "flate2-rust_backend"] }
# Native roots only: the OS certificate store, where internal/private CAs live.
# `rustls-tls-native-roots` also brings the rustls backend and the ring
# provider, so the client still has TLS without `aws` (object_store is what
# otherwise enables them).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
async-trait = { version = "0.1", optional = true }
bytes = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
deltalake = { version = "1.0", default-features = false, features = ["rustls"], optional = true }
# The kernel delta-rs is built on, with the same version and features, so it
# adds no build: its log segment reads the snapshot's `remove` actions, which
# delta-rs exposes without their partition values.
delta_kernel = { package = "buoyant_kernel", version = "=0.28.1", features = ["arrow-59", "internal-api"], optional = true }
percent-encoding = { version = "2", optional = true }
# The kernel reads on a blocking thread and hands batches over a channel.
tokio = { version = "1", features = ["rt", "sync"], optional = true }
futures = { version = "0.3", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
pqbench-resource = { path = "../pqbench-resource" }
url = "2"
# Must match delta-rs's ObjectStore trait version: stores cross that internal
# boundary. Keep the pin until delta-rs upgrades its dependency.
object_store = { version = "=0.13.2", optional = true }
apache-avro = { version = "0.17", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
