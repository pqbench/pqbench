[package]
name = "aipnaming"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "AIP naming linter for Rust source: a fast tree-sitter front end over a backend-neutral declaration model."
# One integration-test target (`tests/it.rs`) instead of one per file: each
# file as its own target links the whole dependency graph again.
autotests = false

[[test]]
name = "it"
path = "tests/it.rs"

[dependencies]
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
