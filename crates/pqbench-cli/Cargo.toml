[package]
name = "pqbench-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Command line frontend for pqbench."

[features]
default = []
delta = ["pqbench/delta"]
aws = ["pqbench/aws"]
delta-s3 = ["delta", "pqbench/delta-s3", "aws"]
iceberg = ["pqbench/iceberg"]
iceberg-s3 = ["iceberg", "pqbench/iceberg-s3", "aws"]

[[bin]]
name = "pqbench"
path = "src/main.rs"

[dependencies]
pqbench = { workspace = true }
clap = { version = "4", features = ["derive"] }
glob = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
