[package]
name = "docscheck"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Run the shell commands in Markdown: a tree-sitter front end that extracts annotated fenced blocks and executes them."
# One integration-test target (`tests/it.rs`) instead of one per file: each
# file as its own target links the whole dependency graph again.
autotests = false

[[test]]
name = "it"
path = "tests/it.rs"

[dependencies]
tree-sitter = "0.27"
tree-sitter-md = "0.5"
