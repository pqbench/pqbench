[package]
name = "docscheck-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Command line frontend for the Markdown command runner."

[[bin]]
name = "docscheck"
path = "src/main.rs"

[dependencies]
docscheck = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
