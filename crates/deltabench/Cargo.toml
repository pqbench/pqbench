[package]
name = "deltabench"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version = "1.91.1"
description = "Delta Lake snapshot orchestration and physical storage analysis."

[dependencies]
pqbench = { workspace = true, features = ["delta"] }

[dev-dependencies]
deltalake = { version = "=0.32.4", default-features = false, features = ["rustls"] }
serde_json = "1"
url = "2"
parquet = { version = "59", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
