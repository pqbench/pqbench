[package]
name = "aipnaming-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Command line frontend for the AIP naming linter."
# One integration-test target (`tests/it.rs`) instead of one per file: each
# file as its own target links the whole dependency graph again.
autotests = false

[[test]]
name = "it"
path = "tests/it.rs"

[[bin]]
name = "aipnaming"
path = "src/main.rs"

[dependencies]
aipnaming = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

# Not distributed: a development tool, not a shipped binary.
[package.metadata.dist]
dist = false
