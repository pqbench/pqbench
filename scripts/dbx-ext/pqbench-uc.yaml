AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  pqbench Unity Catalog external-location fixture: the S3 bucket plus the
  self-assuming IAM role Unity Catalog assumes. This is the AWS half only —
  the storage credential, external location, catalog, schemas, and tables are
  Databricks securables created by seed.py (see README.md).

Parameters:
  BucketName:
    Type: String
    Default: pqbench-uc-e2e-us-east-2
    Description: Globally unique S3 bucket name. Deploy the stack in us-east-2.
  RoleName:
    Type: String
    Default: pqbench-uc
    Description: IAM role that Databricks Unity Catalog assumes.
  DatabricksAccountId:
    Type: String
    Default: c1ed90c8-3f9d-429a-8e60-2bbec3af0989
    Description: Databricks account id, used as the sts:ExternalId condition.
  UnityCatalogIamArn:
    Type: String
    Default: arn:aws:iam::414351767826:role/unity-catalog-prod-UCMasterRole-14S5ZJVKOTYTL
    Description: Unity Catalog master role that assumes this role.

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                - !Ref UnityCatalogIamArn
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${RoleName}"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref DatabricksAccountId
      Policies:
        - PolicyName: pqbench-uc-s3
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:ListBucketMultipartUploads
                  - s3:ListMultipartUploadParts
                  - s3:AbortMultipartUpload
                Resource:
                  - !Sub "arn:aws:s3:::${BucketName}/*"
                  - !Sub "arn:aws:s3:::${BucketName}"
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${RoleName}"

Outputs:
  BucketName:
    Description: External location URL is s3:// plus this value.
    Value: !Ref Bucket
  RoleArn:
    Description: Paste this into the storage credential.
    Value: !GetAtt Role.Arn
