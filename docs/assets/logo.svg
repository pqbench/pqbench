<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="pqbench">
  <!-- The cyclist from Boccioni's 1913 study, reduced to what survives a logo:
       two wheels and a frame, the rider's mass leaning over the bars, and one
       force line for the dynamism. A closer copy of the drawing — its hatching,
       overlapping contours, fork and handlebars — turns to mud below ~24px and
       reads as a machine with a load, so the subject is kept and the hatching
       is not.

       Stroked in paper, not `currentColor`: an `<img>`-loaded SVG is its own
       document, so `currentColor` resolves to black there and would vanish
       against the ink header bar. -->
  <g fill="none" stroke="#f4efe1" stroke-width="1.0" stroke-linecap="round" opacity="0.55">
    <path d="M1.6 20.8 22.4 5.2"/>
  </g>
  <g fill="none" stroke="#f4efe1" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="6.8" cy="16.6" r="3.4"/>
    <circle cx="16.6" cy="16.6" r="3.4"/>
    <path d="M6.8 16.6 11.6 9.6 16.6 16.6M11.6 9.6 15.4 9.2M9.4 16.6 14.0 16.6"/>
  </g>
  <path d="M10.0 4.6C12.4 3.0 15.8 3.8 16.6 6.2 17.2 8.2 16.2 10.2 14.2 10.6L11.2 9.4C10.0 7.9 9.4 6.1 10.0 4.6Z" fill="#f4efe1"/>
</svg>
